[package]
name = "ecg-backend"
version = "0.1.0"
edition = "2021"
description = "Backend WebSocket Medis untuk Streaming Data EKG Real-Time"
default-run = "ecg-backend"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ecg_backend"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
tungstenite = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rumqttc = { version = "0.24", features = ["use-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
jsonwebtoken = "9.3"
dotenvy = "0.15"
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
futures-util = "0.3"
