name: Deploy VPS

on:
  push:
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: fetch & build on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          BACKEND_DIR: /var/www/ecgrhythmia-backend
        run: |
          set -e
          # StrictHostKeyChecking=no: tanpa interaksi di runner (host key tak dikenal di run pertama).
          export SSH_OPTS="-o StrictHostKeyChecking=no"
          # --- backend: fetch + build di VPS, pakai cache offline .sqlx/ (tanpa DB) ---
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "set -e
            cd '$BACKEND_DIR'
            git fetch origin main
            git checkout main
            git pull origin main
            # Bangun dengan cache offline; tak butuh koneksi DATABASE_URL
            SQLX_OFFLINE=true cargo build --release
            # Restart service (sesuaikan nama unit systemd di VPS kamu)
            # /etc/systemd/system/ecg-backend.service
            sudo systemctl restart ecg-backend 2>/dev/null || systemctl --user restart ecg-backend 2>/dev/null || true
          "
      - name: verify
        run: sleep 5 && curl -sf https://api.ecgrhythmia.cloud/api/health || echo "health check gagal, periksa log backend di VPS"
